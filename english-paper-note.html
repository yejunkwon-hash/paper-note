<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>영어 논문 노트</title>
<meta name="description" content="영어 논문을 읽으며 모르는 단어를 바로 찾고, 단어장 · 형광펜 · 요약 글로 정리하는 앱 — 기록은 내 브라우저에만">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Literata:opsz,wght@7..72,400;7..72,600&display=swap">
<style>
/* 영어 논문 노트 — 책상 위에 펼친 종이 한 장: 둘레는 차분한 회청색, 가운데는 흰 종이, 표시는 만년필 잉크색 */
:root{
  --bg:#EEF0F4; --desk:#E3E6EC; --surface:#FFFFFF; --surface2:#F6F7FA; --ink:#1B2130; --dim:#5D6577; --faint:#8D94A3; --line:#DCE0E8; --line2:#C9CED9;
  --accent:#2446C4; --accent-ink:#FFFFFF; --accent-soft:#E6EBFB; --good:#1E8A4F; --warn:#B4541A; --danger:#C2333A;
  --hl-y:#FFE07A; --hl-g:#A6E3B4; --hl-p:#FFB6CB; --hover:rgba(36,70,196,.16); --wordline:#2446C4;
  --s-math:#3E6FD8; --s-phys:#D9483F; --s-chem:#C9831A; --s-bio:#2E9B5F; --s-earth:#24879A; --s-info:#8456D6; --s-etc:#7A8091;
  --shadow:0 1px 2px rgba(20,28,48,.06), 0 8px 24px rgba(20,28,48,.08); --pop:0 10px 40px rgba(16,22,40,.22);
  --f-ui:'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
  --f-read:'Literata', 'Noto Serif KR', Georgia, 'Times New Roman', serif;
  --f-mono:'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Consolas, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#11141A; --desk:#0C0E13; --surface:#191D26; --surface2:#20252F; --ink:#E6E9F0; --dim:#A0A8B8; --faint:#737B8C; --line:#2A303D; --line2:#394152;
  --accent:#8FA6FF; --accent-ink:#0D1530; --accent-soft:#232C4A; --good:#5CC88A; --warn:#E59A5C; --danger:#F07A7F;
  --hl-y:#8A7420; --hl-g:#2F6E40; --hl-p:#8A3B52; --hover:rgba(143,166,255,.22); --wordline:#8FA6FF;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35); --pop:0 10px 40px rgba(0,0,0,.55); color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#11141A; --desk:#0C0E13; --surface:#191D26; --surface2:#20252F; --ink:#E6E9F0; --dim:#A0A8B8; --faint:#737B8C; --line:#2A303D; --line2:#394152;
  --accent:#8FA6FF; --accent-ink:#0D1530; --accent-soft:#232C4A; --good:#5CC88A; --warn:#E59A5C; --danger:#F07A7F;
  --hl-y:#8A7420; --hl-g:#2F6E40; --hl-p:#8A3B52; --hover:rgba(143,166,255,.22); --wordline:#8FA6FF;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35); --pop:0 10px 40px rgba(0,0,0,.55); color-scheme:dark; }
*{ box-sizing:border-box; }
html, body{ height:100%; }
body{ margin:0; background:var(--bg); color:var(--ink); font:14px/1.55 var(--f-ui); -webkit-font-smoothing:antialiased; }
button, input, select, textarea{ font:inherit; color:inherit; }
button{ cursor:pointer; }
:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
[hidden]{ display:none !important; }
.app{ height:100%; display:flex; flex-direction:column; }
/* 위 막대 */
.top{ flex:none; display:flex; align-items:center; gap:10px; height:54px; padding:0 16px; background:var(--surface); border-bottom:1px solid var(--line); position:relative; z-index:20; }
.brand{ display:flex; align-items:center; gap:9px; font-weight:700; font-size:15px; white-space:nowrap; text-decoration:none; color:inherit; }
.brand svg{ width:26px; height:26px; flex:none; }
.brand small{ font-weight:500; color:var(--dim); font-size:12px; }
.nav{ display:flex; gap:2px; margin-left:12px; }
.nav button{ white-space:nowrap; border:0; background:none; padding:7px 12px; border-radius:8px; color:var(--dim); font-weight:600; font-size:13.5px; }
.nav button:hover{ background:var(--surface2); color:var(--ink); }
.nav button.on{ background:var(--accent-soft); color:var(--accent); }
.sp{ flex:1; }
.ib{ width:34px; height:34px; display:inline-grid; place-items:center; border:0; background:none; border-radius:8px; color:var(--dim); }
.ib:hover{ background:var(--surface2); color:var(--ink); } .ib.on{ background:var(--accent-soft); color:var(--accent); }
.ib svg, .btn svg{ width:18px; height:18px; flex:none; }
.btn{ display:inline-flex; align-items:center; justify-content:center; gap:6px; height:34px; padding:0 13px; border:1px solid var(--line2); background:var(--surface); border-radius:8px; font-weight:600; font-size:13px; white-space:nowrap; }
.btn:hover{ border-color:var(--accent); color:var(--accent); }
.btn.pri{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); } .btn.pri:hover{ filter:brightness(1.08); color:var(--accent-ink); }
.btn.ghost{ border-color:transparent; background:none; } .btn.ghost:hover{ background:var(--surface2); }
.btn.danger{ color:var(--danger); } .btn.danger:hover{ border-color:var(--danger); }
.btn:disabled{ opacity:.45; cursor:default; }
.btn.sm{ height:28px; padding:0 9px; font-size:12.5px; }
.view{ flex:1; min-height:0; display:flex; flex-direction:column; }
.scroll-pad{ flex:1; overflow:auto; padding-block:24px 48px; padding-inline:16px; }
.wrap{ max-width:1120px; margin:0 auto; }
h1, h2, h3{ text-wrap:balance; }
.chip{ display:inline-flex; align-items:center; gap:5px; height:22px; padding:0 8px; border-radius:99px; font-size:11.5px; font-weight:700; background:color-mix(in srgb, var(--c, var(--s-etc)) 14%, transparent); color:var(--c, var(--s-etc)); white-space:nowrap; }
.chip::before{ content:''; width:6px; height:6px; border-radius:50%; background:currentColor; }
.muted{ color:var(--dim); } .tiny{ font-size:12px; }
.toast{ position:fixed; left:50%; bottom:24px; transform:translateX(-50%); z-index:200; background:var(--ink); color:var(--bg); padding:10px 16px; border-radius:10px; font-size:13px; box-shadow:var(--pop); max-width:min(560px, calc(100% - 32px)); display:flex; gap:12px; align-items:center; }
.toast button{ border:0; background:none; color:inherit; font-weight:700; text-decoration:underline; }
/* ───── 서재 ───── */
.lib-head{ display:flex; align-items:flex-end; gap:16px; flex-wrap:wrap; margin-bottom:18px; }
.lib-head h1{ font-size:24px; margin:0; letter-spacing:-.01em; }
.lib-head p{ margin:4px 0 0; color:var(--dim); }
.drop{ display:grid; grid-template-columns:auto 1fr auto; gap:14px; align-items:center; padding:16px 18px; border:1.5px dashed var(--line2); border-radius:14px; background:var(--surface); margin-bottom:18px; }
.drop.over{ border-color:var(--accent); background:var(--accent-soft); }
.drop > svg{ width:34px; height:34px; color:var(--accent); }
.drop b{ font-size:14.5px; } .drop span{ display:block; color:var(--dim); font-size:12.5px; }
.drop .acts{ display:flex; gap:8px; flex-wrap:wrap; }
.filters{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px; align-items:center; }
.filters button{ border:1px solid var(--line); background:var(--surface); border-radius:99px; padding:4px 11px; font-size:12.5px; font-weight:600; color:var(--dim); }
.filters button.on{ border-color:var(--ink); color:var(--ink); }
.filters input{ margin-left:auto; height:32px; min-width:0; width:220px; border:1px solid var(--line2); border-radius:8px; padding:0 10px; background:var(--surface); }
.cards{ display:grid; grid-template-columns:repeat(auto-fill, minmax(300px, 1fr)); gap:14px; }
.card{ background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:16px; display:flex; flex-direction:column; gap:10px; min-width:0; }
.card:hover{ border-color:var(--line2); box-shadow:var(--shadow); }
.card-t{ font-family:var(--f-read); font-size:16.5px; font-weight:600; line-height:1.35; margin:0; overflow-wrap:anywhere; cursor:pointer; }
.card-t:hover{ color:var(--accent); }
.card-m{ font-size:12.5px; color:var(--dim); display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
.bar{ height:5px; border-radius:9px; background:var(--surface2); overflow:hidden; } .bar i{ display:block; height:100%; background:var(--c, var(--accent)); border-radius:9px; }
.stats{ display:grid; grid-template-columns:repeat(3, 1fr); gap:6px; font-size:12px; color:var(--dim); font-variant-numeric:tabular-nums; }
.stats b{ display:block; font-size:16px; color:var(--ink); }
.card-a{ display:flex; gap:6px; align-items:center; margin-top:auto; }
.empty{ text-align:center; padding:48px 16px; color:var(--dim); border:1px solid var(--line); border-radius:14px; background:var(--surface); }
.empty b{ display:block; color:var(--ink); font-size:16px; margin-bottom:6px; }
.note-local{ margin-top:22px; font-size:12px; color:var(--faint); display:flex; gap:8px; align-items:flex-start; }
.note-local svg{ width:16px; height:16px; flex:none; margin-top:1px; }
/* 대화창 */
.ov{ position:fixed; inset:0; z-index:100; background:rgba(12,16,28,.45); display:grid; place-items:center; padding:16px; }
.dlg{ width:min(520px, 100%); max-height:calc(100% - 16px); overflow:auto; background:var(--surface); border-radius:14px; box-shadow:var(--pop); padding:20px; display:flex; flex-direction:column; gap:12px; }
.dlg h3{ margin:0; font-size:17px; }
.dlg label{ display:flex; flex-direction:column; gap:5px; font-size:12.5px; font-weight:600; color:var(--dim); }
.dlg input[type=text], .dlg textarea, .dlg select, .in{ border:1px solid var(--line2); border-radius:8px; padding:8px 10px; background:var(--surface); color:var(--ink); font-weight:400; font-size:14px; }
.dlg textarea{ min-height:180px; resize:vertical; font-family:var(--f-read); line-height:1.6; }
.dlg .row{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.dlg .acts{ display:flex; gap:8px; justify-content:flex-end; flex-wrap:wrap; }
.subj-pick{ display:flex; flex-wrap:wrap; gap:6px; }
.subj-pick button{ border:1.5px solid var(--line); background:var(--surface); border-radius:99px; padding:5px 12px; font-weight:700; font-size:12.5px; color:var(--c); }
.subj-pick button.on{ border-color:var(--c); background:color-mix(in srgb, var(--c) 12%, transparent); }
/* ───── 리더 ───── */
.rd{ flex:1; min-height:0; display:grid; grid-template-columns:minmax(0,1fr) 330px; background:var(--desk); }
.rd.side-off{ grid-template-columns:minmax(0,1fr); } .rd.side-off .rd-side{ display:none; }
.rd-main{ position:relative; min-width:0; min-height:0; display:flex; flex-direction:column; }
.rd-bar{ flex:none; display:flex; align-items:center; gap:6px; padding:6px 10px; background:var(--surface); border-bottom:1px solid var(--line); min-height:46px; flex-wrap:wrap; }
.rd-title{ min-width:0; flex:1 1 200px; display:flex; flex-direction:column; line-height:1.25; }
.rd-title b{ font-family:var(--f-read); font-size:14.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.rd-title small{ color:var(--dim); font-size:11.5px; }
.pgbox{ display:inline-flex; align-items:center; gap:4px; font-size:12.5px; color:var(--dim); font-variant-numeric:tabular-nums; }
.pgbox input{ width:44px; height:28px; text-align:center; border:1px solid var(--line2); border-radius:6px; background:var(--surface); }
.zoom output{ display:inline-block; min-width:44px; text-align:center; font-size:12px; color:var(--dim); font-variant-numeric:tabular-nums; cursor:pointer; }
.rd-scroll{ flex:1; min-height:0; overflow:auto; position:relative; outline:none; }
.pages{ padding:20px 16px 80px; display:flex; flex-direction:column; align-items:center; gap:16px; }
.page{ position:relative; background:#fff; box-shadow:var(--shadow); flex:none; }
.page canvas{ position:absolute; inset:0; width:100%; height:100%; display:block; }
.page .hl{ position:absolute; inset:0; z-index:1; pointer-events:none; }
.page .hl div{ position:absolute; border-radius:2px; mix-blend-mode:multiply; opacity:.75; }
.page .hl div.memo::after{ content:''; position:absolute; right:-7px; top:-7px; width:10px; height:10px; border-radius:50%; background:var(--accent); border:2px solid #fff; }
.page .pgno{ position:absolute; right:-36px; bottom:0; font-size:11px; color:var(--faint); font-variant-numeric:tabular-nums; }
.textLayer{ position:absolute; inset:0; overflow:hidden; line-height:1; text-size-adjust:none; -webkit-text-size-adjust:none; forced-color-adjust:none; transform-origin:0 0; z-index:2; opacity:1; }
.textLayer :is(span, br){ color:transparent; position:absolute; white-space:pre; cursor:text; transform-origin:0% 0%; }
.textLayer span.markedContent{ top:0; height:0; }
.textLayer ::selection{ background:rgba(36,70,196,.28); }
.textLayer br::selection{ background:transparent; }
.textLayer .endOfContent{ display:block; position:absolute; inset:100% 0 0; z-index:-1; cursor:default; user-select:none; }
.textLayer .endOfContent.active{ top:0; }
.textLayer mark.w{ color:transparent; background:none; border-bottom:2px dotted var(--wordline); }
/* 글로 붙여 넣은 논문 */
.article{ max-width:720px; margin:24px auto 80px; background:var(--surface); box-shadow:var(--shadow); padding:48px clamp(18px, 6vw, 64px); font-family:var(--f-read); font-size:var(--fs, 17.5px); line-height:1.75; color:var(--ink); border-radius:4px; }
.article h2{ font-size:1.45em; line-height:1.3; margin:0 0 .3em; }
.article .by{ color:var(--dim); font-family:var(--f-ui); font-size:13px; margin-bottom:2em; }
.article h3{ font-size:1.08em; margin:1.8em 0 .5em; letter-spacing:.01em; }
.article p{ margin:0 0 1.05em; overflow-wrap:break-word; }
.article mark.w{ background:none; color:inherit; border-bottom:2px dotted var(--wordline); }
.article mark.h{ color:inherit; border-radius:2px; padding:0 1px; cursor:pointer; }
.article mark.h.y{ background:var(--hl-y); } .article mark.h.g{ background:var(--hl-g); } .article mark.h.p{ background:var(--hl-p); }
.article mark.h.memo{ box-shadow:inset 0 -2px 0 var(--accent); }
.article ::selection{ background:rgba(36,70,196,.25); }
/* 단어를 가리키면 생기는 상자 */
.hoverbox{ position:fixed; z-index:30; pointer-events:none; border-radius:4px; background:var(--hover); box-shadow:0 0 0 1.5px color-mix(in srgb, var(--accent) 55%, transparent); transition:all .06s linear; }
/* 뜻 카드 */
.pop{ position:fixed; z-index:60; width:min(380px, calc(100vw - 20px)); max-height:min(70vh, 560px); overflow:auto; background:var(--surface); border:1px solid var(--line2); border-radius:14px; box-shadow:var(--pop); padding:14px 16px; font-size:13.5px; }
.pop-h{ display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; padding-right:26px; }
.pop-h b{ font-family:var(--f-read); font-size:23px; letter-spacing:-.01em; }
.pop-h .ph{ font-family:var(--f-mono); color:var(--dim); font-size:13px; }
.pop-x{ position:absolute; right:8px; top:8px; }
.pop .say{ width:28px; height:28px; }
.pop .lemma{ font-size:12px; color:var(--dim); }
.ko{ margin:8px 0 6px; display:flex; flex-direction:column; gap:4px; }
.ko div{ display:flex; gap:8px; align-items:baseline; } .ko i{ font-style:normal; flex:none; font-size:11px; font-weight:700; color:var(--accent); background:var(--accent-soft); border-radius:5px; padding:0 6px; }
.ko span{ font-size:15px; font-weight:600; }
.en{ border-top:1px solid var(--line); padding-top:8px; margin-top:8px; display:flex; flex-direction:column; gap:6px; font-family:var(--f-read); font-size:13.5px; line-height:1.5; }
.en em{ font-style:normal; font-family:var(--f-ui); font-size:11px; color:var(--dim); font-weight:700; margin-right:6px; }
.en q{ display:block; color:var(--dim); font-style:italic; quotes:none; margin-top:2px; }
.ctx{ margin-top:10px; padding:9px 11px; background:var(--surface2); border-radius:9px; font-family:var(--f-read); font-size:13px; line-height:1.55; }
.ctx b{ background:var(--accent-soft); color:var(--accent); border-radius:3px; padding:0 2px; }
.ctx .tr{ margin-top:6px; font-family:var(--f-ui); color:var(--dim); font-size:12.5px; }
.save{ margin-top:12px; display:flex; flex-direction:column; gap:7px; }
.save label{ font-size:12px; font-weight:700; color:var(--dim); }
.save textarea{ width:100%; min-height:52px; resize:vertical; border:1px solid var(--line2); border-radius:8px; padding:7px 9px; background:var(--surface); font-size:14px; }
.save .acts{ display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
.loading{ color:var(--faint); font-size:12.5px; display:flex; align-items:center; gap:8px; }
.loading::before{ content:''; width:12px; height:12px; border:2px solid var(--line2); border-top-color:var(--accent); border-radius:50%; animation:spin .8s linear infinite; }
@keyframes spin{ to{ transform:rotate(360deg); } }
@media (prefers-reduced-motion: reduce){ .loading::before{ animation:none; } .hoverbox{ transition:none; } }
.src{ margin-top:8px; font-size:11px; color:var(--faint); }
/* 고른 글 막대 */
.selbar{ position:fixed; z-index:55; display:flex; align-items:center; gap:2px; padding:4px; background:var(--ink); color:var(--bg); border-radius:10px; box-shadow:var(--pop); }
.selbar button{ border:0; background:none; color:inherit; height:30px; padding:0 9px; border-radius:7px; font-size:12.5px; font-weight:600; display:inline-flex; align-items:center; gap:5px; }
.selbar button:hover{ background:rgba(255,255,255,.14); }
.selbar .sw{ width:18px; height:18px; padding:0; border-radius:50%; border:2px solid rgba(255,255,255,.7); }
.selbar .sep{ width:1px; height:20px; background:rgba(255,255,255,.25); margin:0 3px; }
/* 오른쪽 칸 */
.rd-side{ min-height:0; display:flex; flex-direction:column; background:var(--surface); border-left:1px solid var(--line); }
.tabs{ flex:none; display:flex; gap:2px; padding:6px; border-bottom:1px solid var(--line); }
.tabs button{ flex:1; border:0; background:none; border-radius:8px; height:32px; font-size:12.5px; font-weight:700; color:var(--dim); }
.tabs button.on{ background:var(--surface2); color:var(--ink); }
.tabs em{ font-style:normal; font-weight:500; color:var(--faint); margin-left:3px; }
.pane{ flex:1; min-height:0; overflow:auto; padding:10px; }
.wl{ display:flex; flex-direction:column; gap:6px; }
.wi{ display:grid; grid-template-columns:1fr auto; gap:2px 8px; padding:9px 10px; border:1px solid var(--line); border-radius:10px; cursor:pointer; }
.wi:hover{ border-color:var(--line2); background:var(--surface2); }
.wi b{ font-family:var(--f-read); font-size:15px; } .wi span{ grid-column:1/-1; font-size:13px; color:var(--ink); }
.wi small{ grid-column:1/-1; font-size:11.5px; color:var(--dim); font-family:var(--f-read); overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
.wi .pg{ font-size:11px; color:var(--faint); font-variant-numeric:tabular-nums; }
.mi{ padding:9px 10px; border:1px solid var(--line); border-radius:10px; cursor:pointer; display:flex; flex-direction:column; gap:4px; }
.mi:hover{ background:var(--surface2); }
.mi q{ font-family:var(--f-read); font-size:13px; quotes:none; padding-left:9px; border-left:3px solid var(--c); }
.mi p{ margin:0; font-size:12.5px; } .mi small{ color:var(--faint); font-size:11px; }
.toc a{ display:block; padding:6px 8px; border-radius:7px; color:var(--ink); text-decoration:none; font-size:13px; }
.toc a:hover{ background:var(--surface2); } .toc a.l2{ padding-left:22px; color:var(--dim); font-size:12.5px; }
.pane-empty{ color:var(--dim); font-size:12.5px; padding:14px 6px; line-height:1.6; }
.memo-pop textarea{ width:100%; min-height:90px; border:1px solid var(--line2); border-radius:8px; padding:8px; background:var(--surface); resize:vertical; font-size:13.5px; }
.memo-pop .cols{ display:flex; gap:6px; margin:8px 0; }
.memo-pop .cols button{ width:24px; height:24px; border-radius:50%; border:2px solid transparent; }
.memo-pop .cols button.on{ border-color:var(--ink); }
.memo-pop q{ display:block; font-family:var(--f-read); font-size:13px; color:var(--dim); quotes:none; margin:6px 0 10px; max-height:90px; overflow:auto; }
/* ───── 단어장 ───── */
.vhead{ display:flex; gap:12px; align-items:flex-end; flex-wrap:wrap; margin-bottom:14px; }
.vhead h1{ font-size:24px; margin:0; } .vhead p{ margin:4px 0 0; color:var(--dim); }

/* ════════ 알림 · 대화창 ════════ */
function toast(msg, ms, act){ $$('.toast').forEach(t=>t.remove()); const t=document.createElement('div'); t.className='toast'; t.setAttribute('role','status'); t.innerHTML=`<span>${esc(msg)}</span>${act?`<button type="button">${esc(act.label)}</button>`:''}`; document.body.appendChild(t);
  if(act) t.querySelector('button').onclick=()=>{ t.remove(); act.run(); }; setTimeout(()=>t.remove(), ms||2600); }
function dialog(html, bind, onClose){ const ov=document.createElement('div'); ov.className='ov'; ov.innerHTML=`<div class="dlg" role="dialog">${html}</div>`; document.body.appendChild(ov);
  const close=()=>{ if(!ov.isConnected) return; ov.remove(); document.removeEventListener('keydown', key, true); onClose && onClose(); }; const key=e=>{ if(e.key==='Escape'){ e.stopPropagation(); close(); } };
  document.addEventListener('keydown', key, true); ov.addEventListener('pointerdown', e=>{ if(e.target===ov) close(); });
  bind(ov.querySelector('.dlg'), close); const f=ov.querySelector('input, textarea, button.pri'); if(f) setTimeout(()=>f.focus(), 30); return close; }
function confirmBox(title, body, okLabel, fn, danger){ dialog(`<h3>${esc(title)}</h3><p class="muted" style="margin:0">${body}</p><div class="acts"><button class="btn" data-x>취소</button><button class="btn pri" data-ok style="${danger?'background:var(--danger);border-color:var(--danger)':''}">${esc(okLabel)}</button></div>`,
  (d, close)=>{ d.querySelector('[data-x]').onclick=close; d.querySelector('[data-ok]').onclick=()=>{ close(); fn(); }; }); }
function download(name, blob){ const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 2000); }
function speak(word){ try{ const u=new SpeechSynthesisUtterance(word); u.lang=CFG.accent; u.rate=0.9; speechSynthesis.cancel(); speechSynthesis.speak(u); }catch(e){ toast('이 브라우저는 읽어 주기를 못 해요.'); } }
async function copyText(t){ try{ await navigator.clipboard.writeText(t); toast('복사했어요.'); }catch(e){ const ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); toast('복사했어요.'); }catch(_){ toast('복사하지 못했어요.'); } ta.remove(); } }

const IRREG={ was:'be', were:'be', been:'be', is:'be', are:'be', has:'have', had:'have', did:'do', does:'do', done:'do', went:'go', gone:'go', made:'make', took:'take', taken:'take', gave:'give', given:'give', found:'find', shown:'show', known:'know', knew:'know', saw:'see', seen:'see', began:'begin', begun:'begin', grew:'grow', grown:'grow', drew:'draw', drawn:'draw', led:'lead', held:'hold', brought:'bring', thought:'think', sought:'seek', felt:'feel', left:'leave', meant:'mean', kept:'keep', lost:'lose', paid:'pay', said:'say', sent:'send', spent:'spend', stood:'stand', told:'tell', understood:'understand', wrote:'write', written:'write', chose:'choose', chosen:'choose', rose:'rise', risen:'rise', fell:'fall', fallen:'fall', bore:'bear', borne:'bear', data:'datum', phenomena:'phenomenon', criteria:'criterion', analyses:'analysis', hypotheses:'hypothesis', theses:'thesis', matrices:'matrix', indices:'index', vertices:'vertex', nuclei:'nucleus', radii:'radius', spectra:'spectrum', maxima:'maximum', minima:'minimum', media:'medium', larvae:'larva', bacteria:'bacterium', mice:'mouse', children:'child', better:'good', best:'good', worse:'bad', worst:'bad' };
/* 원형 후보: measured → measured, measure, measur … (사전에서 먼저 찾히는 것) */
function lemmas(w){
  w=String(w).toLowerCase().replace(/[’']s$/,'').replace(/[’']/g,"'"); const out=[w]; const add=x=>{ if(x && x.length>1 && !out.includes(x)) out.push(x); };
  if(IRREG[w]) add(IRREG[w]);
  const dbl=s=>/([bcdfgklmnprstvz])\1$/.test(s) ? s.slice(0,-1) : null;
  if(/ies$/.test(w)) add(w.slice(0,-3)+'y'); if(/ves$/.test(w)){ add(w.slice(0,-3)+'f'); add(w.slice(0,-3)+'fe'); }
  if(/(ches|shes|sses|xes|zes|oes)$/.test(w)) add(w.slice(0,-2)); if(/s$/.test(w) && !/ss$/.test(w)) add(w.slice(0,-1));
  if(/ied$/.test(w)) add(w.slice(0,-3)+'y'); if(/ed$/.test(w)){ add(w.slice(0,-1)); add(w.slice(0,-2)); add(dbl(w.slice(0,-2))); }
  if(/ing$/.test(w)){ add(w.slice(0,-3)); add(w.slice(0,-3)+'e'); add(dbl(w.slice(0,-3))); if(/ying$/.test(w)) add(w.slice(0,-4)+'ie'); }
  if(/ier$/.test(w)) add(w.slice(0,-3)+'y'); if(/iest$/.test(w)) add(w.slice(0,-4)+'y'); if(/er$/.test(w)){ add(w.slice(0,-2)); add(w.slice(0,-1)); } if(/est$/.test(w)){ add(w.slice(0,-3)); add(w.slice(0,-2)); }
  if(/ily$/.test(w)) add(w.slice(0,-3)+'y'); if(/ly$/.test(w)){ add(w.slice(0,-2)); if(/ally$/.test(w)) add(w.slice(0,-4)); }
  return out; }
/* 단어 형태 묶음(저장한 단어를 본문에서 찾을 때) */
function formsOf(base, seen){ const b=base.toLowerCase(); const f=new Set([b, ...(seen||[]).map(s=>s.toLowerCase())]);
  const e=b.endsWith('e'), y=/[^aeiou]y$/.test(b), st=e?b.slice(0,-1):b;
  f.add(y?b.slice(0,-1)+'ies':/(s|sh|ch|x|z|o)$/.test(b)?b+'es':b+'s'); f.add(y?b.slice(0,-1)+'ied':e?b+'d':b+'ed'); f.add(st+'ing');
  Object.entries(IRREG).forEach(([k,v])=>{ if(v===b) f.add(k); }); return [...f].filter(x=>x.length>1); }
const DICT_CACHE=new Map();
async function fetchJSON(url, ms){ const ctl=new AbortController(); const t=setTimeout(()=>ctl.abort(), ms||6000); try{ const r=await fetch(url, { signal:ctl.signal }); if(!r.ok) return { _status:r.status }; return await r.json(); } finally{ clearTimeout(t); } }
/* 한국어 뜻 — 구글 번역(사전 모드) → 마이메모리 → 기본 사전 */
async function koMeanings(word){
  const out={ list:[], base:null, src:'' };
  if(CFG.online){
    try{ const j=await fetchJSON('https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=ko&dt=t&dt=bd&dj=1&q='+encodeURIComponent(word));
      if(j && Array.isArray(j.dict) && j.dict.length){ out.list=j.dict.slice(0,4).map(d=>({ pos:d.pos||'', terms:(d.terms||[]).slice(0,5) })); out.base=(j.dict.find(d=>d.base_form)||{}).base_form||null; out.src='Google 번역'; }
      else if(j && j.sentences && j.sentences[0] && j.sentences[0].trans && j.sentences[0].trans.toLowerCase()!==word.toLowerCase()){ out.list=[{ pos:'', terms:[j.sentences[0].trans] }]; out.src='Google 번역'; }
    }catch(e){}
    if(!out.list.length){ try{ const j=await fetchJSON('https://api.mymemory.translated.net/get?langpair=en|ko&q='+encodeURIComponent(word)); const t=j && j.responseData && j.responseData.translatedText;
      if(t && !/MYMEMORY|QUERY LENGTH/i.test(t) && t.toLowerCase()!==word.toLowerCase()){ out.list=[{ pos:'', terms:[t] }]; out.src='MyMemory'; } }catch(e){} }
  }
  if(!out.list.length){ for(const c of lemmas(word)){ if(LOCAL_DICT[c]){ out.list=LOCAL_DICT[c].split(';').map(s=>({ pos:'', terms:[s.trim()] })); out.base=c; out.src='기본 사전'; break; } } }
  return out; }
/* 영영 뜻 · 발음 기호 — Free Dictionary API */
async function enEntry(word){
  if(!CFG.online) return null;
  for(const c of lemmas(word).slice(0,4)){
    try{ const j=await fetchJSON('https://api.dictionaryapi.dev/api/v2/entries/en/'+encodeURIComponent(c), 5000);
      if(Array.isArray(j) && j.length){ const e=j[0]; const ph=e.phonetic || ((e.phonetics||[]).find(p=>p.text)||{}).text || ''; const audio=((e.phonetics||[]).find(p=>p.audio)||{}).audio||'';
        const defs=[]; j.forEach(en=>(en.meanings||[]).forEach(m=>(m.definitions||[]).slice(0,2).forEach(d=>{ if(defs.length<4) defs.push({ pos:m.partOfSpeech, def:d.definition, ex:d.example||'' }); })));
        return { word:e.word, ph, audio, defs }; }
      if(j && j._status && j._status!==404) break;
    }catch(e){ break; } }
  return null; }
async function lookup(word){ const k=word.toLowerCase(); if(DICT_CACHE.has(k)) return DICT_CACHE.get(k);
  const p=Promise.all([koMeanings(word), enEntry(word)]).then(([ko,en])=>{ const base=(en&&en.word)||ko.base||lemmas(word).find(c=>LOCAL_DICT[c])||word.toLowerCase(); return { ko, en, base:base.toLowerCase() }; });
  DICT_CACHE.set(k, p); p.catch(()=>DICT_CACHE.delete(k)); return p; }
async function translate(text){
  if(CFG.online){
    try{ const j=await fetchJSON('https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=ko&dt=t&dj=1&q='+encodeURIComponent(text.slice(0,1800)), 8000); if(j && j.sentences){ const t=j.sentences.map(s=>s.trans||'').join(''); if(t.trim()) return { t, src:'Google 번역' }; } }catch(e){}
    try{ const j=await fetchJSON('https://api.mymemory.translated.net/get?langpair=en|ko&q='+encodeURIComponent(text.slice(0,480)), 8000); const t=j && j.responseData && j.responseData.translatedText; if(t && !/MYMEMORY|QUERY LENGTH/i.test(t)) return { t, src:'MyMemory' }; }catch(e){}
  }
  return null; }

async function addSample(){
  const id=uid(); const text=`Abstract

Damped oscillations appear wherever energy is slowly lost from a vibrating system. In this study, we measured how the amplitude of a simple pendulum decays in air and investigated whether the decay is better described by a linear or a quadratic drag model. Using a smartphone camera at 240 frames per second, we tracked the bob over 300 periods. The amplitude decreased exponentially for small angles, which is consistent with a drag force proportional to velocity. At larger initial angles, however, the decay was significantly faster than the exponential model predicted. These results suggest that both mechanisms contribute, and that their relative importance depends on the initial amplitude.

1. Introduction

A pendulum is often treated as an ideal system with no friction. In reality, every pendulum eventually comes to rest. The rate at which it loses energy reveals the nature of the resistive forces acting on it. Previous studies have shown that air resistance dominates over friction at the pivot for light bobs, but the precise form of the drag force remains a subject of discussion in introductory physics.

2. Methods

The pendulum consisted of a steel sphere (diameter 2.5 cm) suspended from a rigid support by a thin nylon thread of length 1.20 m. The bob was released from initial angles between 5° and 40°. A high-speed camera recorded the motion, and the position of the bob in each frame was extracted with tracking software. We estimated the amplitude of each swing by fitting a parabola to the turning points.

3. Results

For initial angles below 10°, the amplitude followed an exponential decay with a characteristic time of 412 ± 9 s. For larger angles, the data deviated from this trend during the first 50 periods. A model combining linear and quadratic drag reproduced the entire data set with a coefficient of determination above 0.99.

4. Conclusion

Our measurements demonstrate that a simple pendulum can serve as an accessible tool for distinguishing between drag regimes. Future work could examine how the shape and surface roughness of the bob influence the transition between the two regimes.`;
  await DB.put('papers', { id, kind:'text', title:'Amplitude Decay of a Simple Pendulum in Air (예제)', authors:'예제 글 — 연습용으로 만든 짧은 논문', journal:'영어 논문 노트 예제', year:'2026', subject:'phys', text, added:Date.now(), progress:0 });
  go('read/'+id);
}

    V.querySelector('[data-show]').onclick=show; V.querySelector('[data-say]').onclick=()=>speak(w.id); V.querySelector('[data-quit]').onclick=()=>{ this.mode='list'; this.render(); };
    document.onkeydown=e=>{ if(App.view!=='words' || this.mode!=='cards'){ document.onkeydown=null; return; } if(e.key===' '){ e.preventDefault(); if($('[data-show]')) show(); } else if(e.key==='1' && $('[data-again]')) again(); else if(e.key==='2' && $('[data-ok]')) ok(); };
  },
};

function citeOf(p){ const a=(p.authors||'').trim(), y=(p.year||'').trim(); return [a?a+(y?` (${y}).`:'.'):'', p.title?p.title.replace(/\s*\(예제\)$/,'')+'.':'', p.journal?p.journal+'.':'', p.url||''].filter(Boolean).join(' '); }

const b64=blob=>new Promise(res=>{ const r=new FileReader(); r.onload=()=>res(String(r.result).split(',')[1]); r.readAsDataURL(blob); });
function backupDialog(){
  dialog(`<h3>백업</h3><p class="muted" style="margin:0">기록은 이 브라우저에만 있어요. 브라우저 기록을 지우거나 다른 컴퓨터로 옮기기 전에 백업 파일을 받아 두고, 새 곳에서 [불러오기] 하세요.</p>
    <div class="acts" style="justify-content:flex-start"><button class="btn pri" data-full>${I('down')}모두 받기 (PDF 포함)</button><button class="btn" data-lite>${I('down')}기록만 받기 (PDF 빼고 — 가벼움)</button></div>
    <div class="acts" style="justify-content:flex-start"><button class="btn" data-imp>${I('up')}백업 파일 불러오기</button></div>
    <p class="tiny muted" style="margin:0">불러오면 같은 논문 · 단어는 백업 쪽 내용으로 바뀌고, 나머지는 그대로 남아요.</p><div class="acts"><button class="btn" data-x>닫기</button></div>`, (d, close)=>{
    d.querySelector('[data-x]').onclick=close;
    const exp=async withFiles=>{ const o={ app:'eng-paper-note', v:1, at:new Date().toISOString(), papers:await DB.all('papers'), words:await DB.all('words'), marks:await DB.all('marks'), essays:await DB.all('essays'), files:[] };
      if(withFiles) for(const f of await DB.all('files')) o.files.push({ id:f.id, b64:await b64(f.blob) });
      const d0=new Date(); download(`영어논문노트_백업_${d0.getFullYear()}${String(d0.getMonth()+1).padStart(2,'0')}${String(d0.getDate()).padStart(2,'0')}.json`, new Blob([JSON.stringify(o)], { type:'application/json' })); toast('백업 파일을 받았어요.'); close(); };

    d.querySelector('[data-imp]').onclick=()=>{ const i=document.createElement('input'); i.type='file'; i.accept='.json,application/json'; i.onchange=async()=>{ const f=i.files[0]; if(!f) return; let o; try{ o=JSON.parse(await f.text()); }catch(e){ return toast('백업 파일을 읽지 못했어요.'); }
      if(!o || o.app!=='eng-paper-note') return toast('영어 논문 노트의 백업 파일이 아니에요.');
      for(const k of ['papers','words','marks','essays']) for(const x of (o[k]||[])) await DB.put(k, x);
      for(const x of (o.files||[])){ const bin=atob(x.b64); const u=new Uint8Array(bin.length); for(let j=0;j<bin.length;j++) u[j]=bin.charCodeAt(j); await DB.put('files', { id:x.id, blob:new Blob([u], { type:'application/pdf' }) }); }
      close(); toast(`불러왔어요 — 논문 ${(o.papers||[]).length}편 · 단어 ${(o.words||[]).length}개.`); route(); }; i.click(); };
  });
}

    q('#c-on').onchange=e=>{ CFG.online=e.target.checked; saveCfg(); DICT_CACHE.clear(); }; q('#c-ul').onchange=e=>{ CFG.underline=e.target.checked; saveCfg(); if(Reader.cur) Reader.refreshWords(); }; q('#c-hv').onchange=e=>{ CFG.hover=e.target.checked; saveCfg(); };
    q('[data-x]').onclick=close;
    q('[data-wipe]').onclick=()=>{ close(); confirmBox('모든 기록을 지울까요?', '이 브라우저의 논문 · 단어장 · 형광펜 · 글이 모두 지워지고 되돌릴 수 없어요. 먼저 [백업]을 받아 두세요.', '모두 지우기', async()=>{ for(const s of ['papers','files','words','marks','essays']) await DB.clear(s); toast('모두 지웠어요.'); go(''); }, true); };
  });
}
/* ════════ 시작 ════════ */
async function boot(){
  applyTheme();
  $('#app').innerHTML=`<header class="top"><a class="brand" href="#" aria-label="영어 논문 노트 — 내 논문">${LOGO}<span>영어 논문 노트<br><small>English Paper Notes</small></span></a>
    <nav class="nav" aria-label="메뉴"><button data-v="lib">${'내 논문'}</button><button data-v="words">단어장</button></nav><span class="sp"></span>
    <button class="btn ghost sm" id="t-bk" title="백업 · 불러오기">${I('down')}<span class="hide-s">백업</span></button><button class="ib" id="t-cf" title="설정" aria-label="설정">${I('gear')}</button></header><main class="view" id="view"></main>`;
  $$('.nav button').forEach(b=>b.onclick=()=>{ if(b.dataset.v==='words'){ Vocab.mode='list'; go('words'); } else go(''); });
  $('#t-bk').onclick=backupDialog; $('#t-cf').onclick=settingsDialog;
  try{ await DB.open(); }catch(e){ $('#view').innerHTML='<div class="scroll-pad"><div class="empty"><b>이 브라우저에서는 기록을 저장할 수 없어요</b>사생활 보호(시크릿) 창이거나 사이트 데이터 저장이 막혀 있어요. 일반 창에서 열어 주세요.</div></div>'; return; }
  window.addEventListener('hashchange', route); window.addEventListener('beforeunload', ()=>Reader.saveSpot && Reader.cur && Reader.saveSpot(true));
  route();
}
boot();

</script>
